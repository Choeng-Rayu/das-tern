##############################################################
# Nginx config — subdomain-based routing for dastern.site
#
#  api.dastern.site     → NestJS backend  (127.0.0.1:3001)
#  ocr.dastern.site     → OCR service     (127.0.0.1:8000)
#  ai.dastern.site      → AI LLM service  (127.0.0.1:8001)
#  payment.dastern.site → external VPS    (not hosted here)
##############################################################

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ocr:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ai:10m rate=10r/s;

# ─── HTTP → HTTPS redirect (all subdomains) ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.dastern.site ocr.dastern.site ai.dastern.site;

    # Allow Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── api.dastern.site — NestJS Backend ───────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dastern.site;

    ssl_certificate     /etc/letsencrypt/live/api.dastern.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dastern.site/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 20M;

    location / {
        limit_req zone=api burst=40 nodelay;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "keep-alive";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# ─── ocr.dastern.site — OCR Service ──────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ocr.dastern.site;

    ssl_certificate     /etc/letsencrypt/live/ocr.dastern.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocr.dastern.site/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 20M;

    location / {
        limit_req zone=ocr burst=10 nodelay;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# ─── ai.dastern.site — AI LLM Service ────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.dastern.site;

    ssl_certificate     /etc/letsencrypt/live/ai.dastern.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.dastern.site/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 10M;

    location / {
        limit_req zone=ai burst=20 nodelay;

        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
}
