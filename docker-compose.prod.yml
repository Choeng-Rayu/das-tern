##############################################################
#  docker-compose.prod.yml — Production deployment
#  Domain: dastern.site  |  VPS: 167.71.194.68
#  Architecture: Unified deployment with shared infrastructure
#
#  INFRASTRUCTURE (Shared):
#    - postgres:5432  → Shared database for ALL services
#    - redis:6379     → Shared cache/sessions for ALL services
#    - rabbitmq:5672  → Message queue (backend, future services)
#    - minio:9000     → Object storage (backend)
#
  #  APPLICATION SERVICES:
  #    - backend:3001        → Main NestJS API (api.dastern.site)
  #    - ocr:8000           → OCR processing (internal only)
  #    - ai-llm:8001        → AI/LLM service (internal only)
  #    - bakong-payment:3002 → Bakong payment service (internal only)
  #
  #  REVERSE PROXY:
  #    - nginx:80/443       → Reverse proxy for api.dastern.site
  #
  #  NETWORK ARCHITECTURE:
  #    - All services in 'dastern-network' for internal communication
  #    - Only Nginx exposes ports 80/443 to public internet
  #    - Application services only exposed to Docker network (no host binding)
  #    - Inter-service URLs use Docker service names (e.g., http://bakong-payment:3002)
  #    - External clients access ONLY api.dastern.site through Nginx
##############################################################

services:

  # ─────────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: dastern-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dastern}
      POSTGRES_USER: ${POSTGRES_USER:-dastern_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      TZ: Asia/Phnom_Penh
      PGTZ: Asia/Phnom_Penh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c timezone=Asia/Phnom_Penh
      -c log_min_duration_statement=1000
      -c max_connections=50
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=32MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dastern_user} -d ${POSTGRES_DB:-dastern}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dastern-network

  redis:
    image: redis:7.4-alpine
    container_name: dastern-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dastern-network

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: dastern-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dastern_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - dastern-network

  minio:
    image: minio/minio:latest
    container_name: dastern-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dastern_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dastern-network

  # ─────────────────────────────────────────────────
  # Application Services
  # ─────────────────────────────────────────────────

  backend:
    build:
      context: ./backend_nestjs
      dockerfile: Dockerfile
    container_name: dastern-backend
    restart: unless-stopped
    env_file:
      - ./backend_nestjs/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      API_PREFIX: api/v1
      # DATABASE_URL and DATABASE_READ_URL come from env_file (backend_nestjs/.env)
      # They must be set with URL-encoded passwords to handle special characters (e.g. @, #).
      POSTGRES_USER: "${POSTGRES_USER:-dastern_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-dastern}"
      # Redis — Docker service name
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "0"
      # MinIO / S3 — Docker service name
      AWS_S3_ENDPOINT: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-dastern_admin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_S3_BUCKET: "${MINIO_BUCKET_NAME:-dastern-uploads}"
      # Internal service URLs — Docker service names
      AI_SERVICE_URL: "http://ai-llm:8001"
      OCR_SERVICE_URL: "http://ocr:8000"
      # OAuth callbacks — production subdomain
      GOOGLE_CALLBACK_URL: "https://api.dastern.site/api/v1/auth/google/callback"
      TELEGRAM_OAUTH_REDIRECT_URI: "https://api.dastern.site/api/v1/auth/telegram/callback"
      # Bakong payment — internal Docker network communication
      BAKONG_SERVICE_URL: "http://bakong-payment:3002"
      # CORS — allow subdomains
      ALLOWED_ORIGINS: "https://api.dastern.site"
      TZ: Asia/Phnom_Penh
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dastern-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:3001}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    container_name: dastern-ocr
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      MAX_UPLOAD_SIZE_MB: "10"
      TZ: Asia/Phnom_Penh
    expose:
      - "8000"
    networks:
      - dastern-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  ai-llm:
    build:
      context: ./ai-llm-service
      dockerfile: Dockerfile
    container_name: dastern-ai-llm
    restart: unless-stopped
    env_file:
      - ./ai-llm-service/.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      TZ: Asia/Phnom_Penh
    expose:
      - "8001"
    networks:
      - dastern-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────
  # Bakong Payment Service
  # ─────────────────────────────────────────────────
  # Uses SHARED postgres and redis from infrastructure above
  # Database: Creates 'bakong_payment' schema in shared postgres
  # Port: 3002 (exposed via Nginx at payment.dastern.site)
  # Internal URL: http://bakong-payment:3002 (used by backend)

  bakong-payment:
    build:
      context: ./bakong_payment
      dockerfile: Dockerfile
    container_name: dastern-bakong-payment
    restart: unless-stopped
    env_file:
      - ./bakong_payment/.env
    environment:
      NODE_ENV: production
      PORT: "3002"
      # Database — Uses SHARED postgres instance with separate database/schema
      # Note: Must use service name 'postgres' NOT 'localhost'
      DATABASE_URL: "postgresql://${POSTGRES_USER:-dastern_user}:${POSTGRES_PASSWORD}@postgres:5432/bakong_payment?schema=public"
      # Redis — Uses SHARED redis instance
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      # Bakong API credentials (from bakong_payment/.env)
      BAKONG_MERCHANT_ID: "${BAKONG_MERCHANT_ID}"
      BAKONG_PHONE_NUMBER: "${BAKONG_PHONE_NUMBER}"
      BAKONG_DEVELOPER_TOKEN: "${BAKONG_DEVELOPER_TOKEN}"
      BAKONG_API_URL: "${BAKONG_API_URL}"
      DEFAULT_MERCHANT_NAME: "${DEFAULT_MERCHANT_NAME}"
      DEFAULT_MERCHANT_CITY: "${DEFAULT_MERCHANT_CITY}"
      # Backend integration
      MAIN_BACKEND_API_KEY: "${MAIN_BACKEND_API_KEY}"
      MAIN_BACKEND_WEBHOOK_URL: "http://backend:3001/api/v1/webhooks/bakong"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      # Pricing
      PREMIUM_PRICE: "${PREMIUM_PRICE}"
      FAMILY_PREMIUM_PRICE: "${FAMILY_PREMIUM_PRICE}"
      # CORS — allow all subdomains
      CORS_ORIGIN: "https://api.dastern.site,https://dastern.site"
      TZ: Asia/Phnom_Penh
    expose:
      - "3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dastern-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:3002}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    volumes:
      - bakong_public:/app/public
      - bakong_logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────────────
  # Handles public HTTPS traffic for api.dastern.site
  # Routes requests to backend:3001 (only public-facing service)
  # All other services remain internal to Docker network

  nginx:
    image: nginx:alpine
    container_name: dastern-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - ocr
      - ai-llm
      - bakong-payment
    networks:
      - dastern-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  bakong_public:
    driver: local
  bakong_logs:
    driver: local

networks:
  dastern-network:
    driver: bridge
