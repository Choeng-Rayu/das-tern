##############################################################
# Nginx config — payment.dastern.site
#
#  payment.dastern.site → Bakong Payment Service (127.0.0.1:3002)
#
# NOTE: This runs on YOUR LOCAL MACHINE (not the VPS).
#       The domain resolves via a dynamic DNS / Cloudflare proxy
#       or port-forwarding from the VPS. See the runbook for details.
##############################################################

# Rate limiting zone for payment service
limit_req_zone $binary_remote_addr zone=payment:10m rate=10r/s;

# ─── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name payment.dastern.site;

    # Allow Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── payment.dastern.site — Bakong Payment Service ────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name payment.dastern.site;

    ssl_certificate     /etc/letsencrypt/live/payment.dastern.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/payment.dastern.site/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 10M;

    # Health check endpoint (public, no rate limit)
    location /api/health {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # QR code static files
    location /public/ {
        alias /home/rayu/das-tern/bakong_payment/public/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Main API
    location / {
        limit_req zone=payment burst=20 nodelay;

        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "keep-alive";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
