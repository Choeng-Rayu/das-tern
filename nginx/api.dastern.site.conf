##############################################################
# Nginx Server Block Configuration for api.dastern.site
#
# Purpose: Reverse proxy for NestJS backend API
# Backend: http://127.0.0.1:3001
# SSL: Let's Encrypt via Certbot
#
# To enable this configuration on the VPS:
#   1. Copy to: /etc/nginx/sites-available/api.dastern.site.conf
#   2. Create symlink: ln -s /etc/nginx/sites-available/api.dastern.site.conf /etc/nginx/sites-enabled/
#   3. Test config: nginx -t
#   4. Reload: systemctl reload nginx
##############################################################

# Rate limiting zone for API endpoints
# Allows 20 requests per second per IP address
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# ─── HTTP Server Block (Port 80) ─────────────────────────────
# Handles HTTP traffic and redirects to HTTPS
# Allows Certbot ACME challenge for SSL certificate renewal
server {
    listen 80;
    listen [::]:80;
    server_name api.dastern.site;

    # Allow Certbot ACME challenge for SSL certificate renewal
    # This location must remain accessible via HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS Server Block (Port 443) ───────────────────────────
# Main API server with SSL/TLS encryption
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dastern.site;

    # ─── SSL/TLS Configuration ────────────────────────────────
    # SSL certificate paths (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/api.dastern.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dastern.site/privkey.pem;

    # SSL protocols - only modern, secure versions
    ssl_protocols       TLSv1.2 TLSv1.3;
    
    # SSL ciphers - strong encryption algorithms
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # SSL session caching for performance
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # OCSP stapling for certificate validation
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ─── Security Headers ─────────────────────────────────────
    # HSTS - Force HTTPS for 1 year including subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Prevent clickjacking attacks
    add_header X-Frame-Options SAMEORIGIN always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options nosniff always;
    
    # XSS protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # ─── File Upload Configuration ───────────────────────────
    # Maximum request body size (for file uploads)
    client_max_body_size 20M;
    
    # Client body buffer size
    client_body_buffer_size 128k;
    
    # Timeouts for client connections
    client_body_timeout 12;
    client_header_timeout 12;

    # ─── Gzip Compression ─────────────────────────────────────
    # Enable gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-component text/x-cross-domain-policy;
    gzip_disable "msie6";

    # ─── Proxy Configuration ──────────────────────────────────
    # Main location block - proxies all requests to NestJS backend
    location / {
        # Rate limiting - burst allows temporary spikes
        # 40 requests can burst, with base rate of 20r/s
        limit_req zone=api burst=40 nodelay;

        # Proxy pass to NestJS backend
        proxy_pass         http://127.0.0.1:3001;
        
        # Use HTTP/1.1 for proxy connection
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        
        # Pass original host header
        proxy_set_header   Host $host;
        
        # Pass real client IP address
        proxy_set_header   X-Real-IP $remote_addr;
        
        # Pass full chain of proxy IPs
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Pass original protocol (https)
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        # Pass original host
        proxy_set_header   X-Forwarded-Host $host;
        
        # Disable buffering for proxied requests
        proxy_buffering    off;
        
        # Bypass cache for upgraded connections
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for proxy connection
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        
        # Redirect handling
        proxy_redirect     off;
    }

    # ─── Health Check Endpoint (Optional) ─────────────────────
    # Uncomment if you want a separate health check without rate limiting
    # location /health {
    #     proxy_pass         http://127.0.0.1:3001/health;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host $host;
    #     access_log         off;
    # }

    # ─── Logging Configuration ────────────────────────────────
    # Access log
    access_log /var/log/nginx/api.dastern.site.access.log;
    
    # Error log with warning level
    error_log  /var/log/nginx/api.dastern.site.error.log warn;
}
