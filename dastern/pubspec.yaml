name: dastern
description: "Das Tern — patient-centred medication management (Flutter + Supabase)."
publish_to: "none"

# Build numbers can be overridden at build time via --build-name / --build-number.
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.32.0"

# ──────────────────────────────────────────────────────────────────────
# Dependencies
#
# Versions are pinned with caret ranges to balance stability and patch
# updates. When a feature spec is implemented, that spec is responsible
# for adding any additional plugins it needs (Supabase, Drift, OCR, etc.).
# This keeps the foundation install lean and quick.
# ──────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Persistence (lightweight prefs only; Drift comes with the sync task)
  shared_preferences: ^2.3.4

  # Formatting / i18n
  intl: ^0.20.0

  # Logging
  logger: ^2.5.0

  # UI helpers
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2843.0
  flutter_svg: ^2.0.16

# ──────────────────────────────────────────────────────────────────────
# Planned dependencies — added by the feature spec that owns them.
#
#   01-supabase-data-layer:
#     supabase_flutter: ^2.8.4
#     flutter_secure_storage: ^9.2.2
#
#   reminder / sync foundation:
#     drift: ^2.22.1
#     drift_flutter: ^0.2.4
#     sqlite3_flutter_libs: ^0.5.27
#     connectivity_plus: ^6.1.0
#     flutter_local_notifications: ^18.0.1
#     firebase_core: ^3.8.0
#     firebase_messaging: ^15.1.5
#
#   02-authentication:
#     google_sign_in: ^6.2.2
#     sign_in_with_apple: ^6.1.4   # iOS phase
#
#   05-family-doctor-connections:
#     qr_flutter: ^4.1.0
#     mobile_scanner: ^6.0.2
#
#   07-ocr-prescription-scanning:
#     google_mlkit_text_recognition: ^0.15.0
#     flutter_tesseract_ocr: ^0.4.30
#     camera: ^0.11.0+2
#     image_picker: ^1.1.2
#
#   08-google-play-billing:
#     in_app_purchase: ^3.2.0
#
#   observability (Phase 5):
#     sentry_flutter: ^8.10.1
#
#   models (added by the first spec that introduces a freezed model):
#     freezed_annotation: ^2.4.4
#     json_annotation: ^4.9.0
# ──────────────────────────────────────────────────────────────────────

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

# Generated build outputs are committed (per spec Req 3.3); build_runner is
# only needed when regenerating. Will be added by the first freezed/drift task.
#   build_runner: ^2.4.13
#   freezed: ^2.5.7
#   json_serializable: ^6.8.0
#   drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  # Enables flutter_localizations ARB → AppLocalizations codegen.
  # See l10n.yaml at the project root for input/output paths.
  generate: true

  # Asset folders — currently empty placeholders. Drop SVG illustrations
  # into assets/illustrations/ and PNG/SVG icons into assets/icons/ as the
  # design system grows. See assets/README.md for guidelines.
  # Uncomment when the first asset is added:
  # assets:
  #   - assets/illustrations/
  #   - assets/icons/

  # Khmer + Latin font stack. Drop the .ttf files into assets/fonts/ when
  # ready; see assets/fonts/README.md for sources. Until then, Flutter
  # relies on the OS Noto fonts which still render Khmer correctly on
  # Android 10+ and iOS 14+.
  # fonts:
  #   - family: NotoSansKhmer
  #     fonts:
  #       - asset: assets/fonts/NotoSansKhmer-Regular.ttf
  #       - asset: assets/fonts/NotoSansKhmer-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/NotoSansKhmer-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/NotoSansKhmer-Bold.ttf
  #         weight: 700
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
