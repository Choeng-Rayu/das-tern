# Nginx Configuration for DasTern Docker Deployment
# This configuration runs inside a Docker container and serves api.dastern.site
# 
# Architecture:
# - Only api.dastern.site is publicly accessible (HTTPS)
# - Backend service: http://backend:3001 (Docker service name, internal only)
# - OCR service: Internal Docker network only (no public access)
# - AI-LLM service: Internal Docker network only (no public access)
# - Bakong service: Internal Docker network only (no public access)
#
# Docker Service Name Resolution:
# - Docker's internal DNS resolves service names (e.g., 'backend') to container IPs
# - Services communicate over the Docker bridge network
# - No need for localhost or external IPs
#
# SSL Certificate Mounting:
# - Certificates are mounted from VPS host at /etc/letsencrypt
# - Volume mapping: /etc/letsencrypt:/etc/letsencrypt:ro (read-only)
# - Certbot on VPS manages certificate renewal

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 20M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Rate limiting zone for API protection
    # - 20 requests per second per IP
    # - 10MB shared memory for tracking IPs
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Default security headers (applied to all responses)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Upstream backend service
    # Using Docker service name 'backend' which resolves via Docker DNS
    upstream backend_upstream {
        server backend:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTP Server - Redirect to HTTPS
    # Port 80 is only used for:
    # 1. ACME challenges (Let's Encrypt certificate validation)
    # 2. Redirecting all other traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name api.dastern.site;

        # Allow Certbot ACME challenge for SSL certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS Server - Main API Gateway
    # This is the ONLY publicly accessible endpoint
    # All API requests are proxied to the internal backend service
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.dastern.site;

        # SSL Certificate Configuration
        # Certificates are managed by Let's Encrypt on the VPS host
        # and mounted into the container as read-only volumes
        ssl_certificate /etc/letsencrypt/live/api.dastern.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.dastern.site/privkey.pem;

        # SSL Security Settings (Mozilla Intermediate Configuration)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # SSL session cache for performance
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP Stapling for faster SSL validation
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/api.dastern.site/chain.pem;

        # Additional Security Headers for HTTPS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Request size limits
        client_max_body_size 20M;
        client_body_timeout 60s;
        client_header_timeout 60s;

        # Root location - Proxy all API requests to backend
        # Backend service runs on Docker network at http://backend:3001
        location / {
            # Rate limiting: 20 requests/second with burst of 40
            # - burst: allows temporary spikes above the rate
            # - nodelay: don't delay requests within burst limit
            limit_req zone=api_limit burst=40 nodelay;
            limit_conn addr 10;

            # Proxy to backend service using Docker service name
            proxy_pass http://backend_upstream;

            # Proxy headers for proper request forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support (if needed for real-time features)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # Don't pass Authorization header to upstream by default
            # (uncomment if backend needs it)
            # proxy_pass_header Authorization;

            # Error handling
            proxy_intercept_errors off;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Health check endpoint (optional)
        location /health {
            access_log off;
            proxy_pass http://backend_upstream/health;
            proxy_set_header Host $host;
        }

        # Nginx status endpoint (for monitoring, accessible only internally)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 172.16.0.0/12;  # Docker network range
            deny all;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

}
