name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy das-tern to DigitalOcean VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            chmod +x /root/das-tern/auto-deploy.sh
            bash /root/das-tern/auto-deploy.sh

      - name: Verify services are healthy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 2m
          script: |
            sleep 5
            docker compose -f /root/das-tern/docker-compose.prod.yml ps
            echo "---"
            curl -sf http://localhost:3001/api/v1/health && echo "Backend OK" || echo "Backend not ready yet"
            curl -sf http://localhost:8000/api/v1/health && echo "OCR OK" || echo "OCR not ready yet"
            curl -sf http://localhost:8001/health && echo "AI-LLM OK" || echo "AI-LLM not ready yet"
